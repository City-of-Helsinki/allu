<div class="login" *ngIf="!showLogoutInfo">
  <h1>{{'login.title' | translation}}</h1>
  <form role="form" (submit)="login($event, username.value)">
    <label for="username">{{'user.username' | translation}}</label>
    <input type="text" #username class="form-control" id="username" [placeholder]="'user.username' | translation">
    <button type="submit" class="btn btn-default">{{'login.submit' | translation}}</button>
  </form>
</div>
<div *ngIf="showLogoutInfo" class="logout">
  <h1>{{'logout.header' | translation}}</h1>
  <p>{{'logout.infoText' | translation}}</p>
</div>
