spring.datasource.username = allu_reporting
spring.datasource.password= {{ database_password_allu_reporting }}
spring.datasource.url=jdbc:postgresql://{{ reporting_database_host }}:{{ reporting_database_port }}/allu_reporting?options=-c%20statement_timeout%3D3600000%20-c%20transaction_timeout%3D7200000
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.schemas=allureport

etl.cronstring={{ etl_cronstring | default('0 0 1 * * *')}}
etl.sql.files={{etl_sql_files}}
etl.cleanup.cronstring={{ etl_cleanup_cronstring | default('0 45 */6 * * *')}}
etl.cleanup.sql.files={{ etl_cleanup_sql_files | default('cleanup.sql')}}
